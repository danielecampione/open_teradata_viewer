plugins {
    id 'java'
    id 'application'
}

group = 'net.sourceforge.open_teradata_viewer'
version = '0.39a'

// Explicit toolchain: Gradle LOOKS FOR (or requests) a JDK 11+ to compile,
// regardless of which JDK launches gradlew/the daemon. This resolves the case
// where the default JDK on PATH/JAVA_HOME is older than 11 - with only
// sourceCompatibility/
// targetCompatibility, Gradle would try to compile with THAT JDK and
// would fail with "invalid source release: 11".
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

application {
    mainClass = 'net.sourceforge.open_teradata_viewer.Main'
}

// Pins the version regenerated by "gradlew wrapper" to the one already
// referenced in gradle/wrapper/gradle-wrapper.properties, so the two can
// never silently drift apart if the wrapper task is ever re-run.
wrapper {
    gradleVersion = '8.14.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Full debug information (source file, line numbers, local variable names)
    // is always embedded in the compiled classes, independently of any IDE
    // debug configuration: required to attach a remote debugger (e.g. jdb) or
    // to read a meaningful stack trace when the project is built purely from
    // the command line.
    options.debug = true
    options.debugOptions.debugLevel = 'source,vars,lines'
    // Surfaces deprecation and unchecked-operation warnings at compile time,
    // where they would otherwise only show up as inline markers in an IDE.
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// Standard Gradle layout:
//   src/main/java, src/main/resources               the application
//   src/test/java, src/test/resources               the JUnit 5 tests
//   src/robotGuiTest/java, src/robotGuiTest/resources   the Robot-driven graphical tests
// The graphical tests are a source set of their own, rather than part of
// src/test, because they need a visible desktop session and must never be
// picked up by a plain "gradlew test"/"build"/"check".
// Everything that is not Java code (icons, RSTA themes, messages*.properties,
// help pages, templates) belongs under src/main/resources, at the same
// relative path it is looked up by on the classpath: a non-Java file left
// in src/main/java is silently left out of the jar.
sourceSets {
    robotGuiTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    robotGuiTestImplementation.extendsFrom implementation
}

// poi-ooxml declares poi-ooxml-lite among its own dependencies, but
// poi-ooxml-full (declared below) replaces it rather than complementing it:
// both ship the same schema classes and the same XMLBeans type-system files,
// so with both on a classpath it is down to jar order which copy of a given
// file gets used - and in the merged runnableJar, to whichever copy happens
// to be met first. Excluded everywhere so that only one of the two can ever
// be present.
configurations.configureEach {
    exclude group: 'org.apache.poi', module: 'poi-ooxml-lite'
}

// Dependencies are resolved from Maven Central instead of being vendored as
// jars under lib/: lighter repository, and transitive dependencies (e.g.
// POI's own commons-* jars) are picked up automatically instead of being
// tracked and updated by hand.
// NOTE ON "--offline": a resolved dependency is kept in the Gradle cache
// (normally under the launching user's home directory) and reused on every
// later build without touching the network again, which is why the
// RUN-*/COMPILE-*.bat scripts can default to --offline. The one case that
// needs the network is the very first build after a dependency is added or
// its version changes, before anything is cached yet - the .bat scripts
// handle that themselves (offline attempt first, automatic online retry
// only if that fails), so no manual step is needed here.
repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-codec:commons-codec:1.11'
    implementation 'com.jgoodies:jgoodies-forms:1.8.0'
    // 2.8.0 (the version previously vendored as a local jar) was never
    // published to Maven Central under this group/artifact - 2.7.0 is the
    // newest one actually there. Look and feel classes are a narrow,
    // stable API surface, so the one-step difference is low risk.
    implementation 'com.jgoodies:jgoodies-looks:2.7.0'
    implementation 'joda-time:joda-time:2.10.1'
    implementation 'com.github.jsqlparser:jsqlparser:2.0'
    implementation 'com.itextpdf:itextpdf:5.5.13.5'
    implementation 'org.json:json:20260522'

    // poi-ooxml-full replaces poi-ooxml-lite (broader schema coverage, same
    // API; see the exclusion above). Everything else POI
    // requires at runtime (commons-collections4, commons-compress,
    // commons-io, commons-math3, curvesapi, log4j-api, SparseBitSet,
    // xmlbeans, and a matching commons-codec) comes in transitively and no
    // longer needs its own line here.
    implementation 'org.apache.poi:poi:5.5.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.poi:poi-ooxml-full:5.5.1'

    implementation 'com.fifesoft:rstaui:3.3.2'
    implementation 'com.fifesoft:autocomplete:3.3.3'
    implementation 'com.fifesoft:languagesupport:3.4.1'
    implementation 'com.fifesoft:spellchecker:3.4.1'
    implementation 'org.mozilla:rhino-all:1.9.0'
    // Groovy's JSR-223 engine, looked up by RunMacroAction through
    // javax.script.ScriptEngineManager to run the "*.groovy" macros. Groovy
    // 3.0.x is still published under the org.codehaus.groovy group (the
    // org.apache.groovy group only starts with 4.0), and it stays at 3.0.25,
    // the version OTV currently ships with: the 4.x line is a separate
    // upgrade. The core artifact declares only optional dependencies, which
    // Gradle does not resolve, so nothing else is pulled in transitively.
    implementation 'org.codehaus.groovy:groovy:3.0.25'
    implementation 'org.codehaus.groovy:groovy-jsr223:3.0.25'
    // Every sibling library declared above (rstaui, autocomplete,
    // languagesupport, spellchecker) is built against rsyntaxtextarea 3.6.1.
    // "strictly" keeps the version pinned in this one place: were any of them
    // to ask for a newer one in the future, the build fails loudly instead
    // of Gradle silently taking the highest version found in the graph.
    implementation('com.fifesoft:rsyntaxtextarea') {
        version { strictly '3.6.1' }
    }

    // The old monolithic "-all" bundle was never published to Maven
    // Central under any group ID; the maintained fork instead publishes
    // one artifact per component. OTV only calls into
    // com.l2fprod.common.swing.JDirectoryChooser (SwingFileDialogs.java),
    // which lives in the "directorychooser" component alone, so that is
    // the only one pulled in - smaller than the local "-all" jar it
    // replaces, not just an equivalent swap.
    implementation 'com.l2fprod.common:l2fprod-common-directorychooser:6.9.1'

    // Actual JUnit 5 for the 4 existing tests (TestFormatStyleBasic,
    // TestFormatStyleDdl, TestXMLBeautifier, TestSHA1SumCalculator).
    // WARNING: use the 1.x line (Jupiter 5, Java 8+), NOT the 6.x line
    // (Jupiter 6, requires Java 17+, incompatible with Java 11).
    // "junit-platform-console-standalone" already contains Jupiter
    // API+engine, Platform launcher, opentest4j, and apiguardian all
    // together, so this one coordinate is all that's needed.
    testImplementation 'org.junit.platform:junit-platform-console-standalone:1.14.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-console-standalone:1.14.4'
}

test {
    useJUnitPlatform()
    workingDir = projectDir // english_dic.zip and the i18n resources are searched for here
}

tasks.named('run') {
    workingDir = projectDir
}

// The launcher script installDist generates falls back to whatever "java"
// is first on PATH whenever JAVA_HOME isn't set in the environment it runs
// in - exactly the kind of ambient, per-machine dependency the toolchain
// elsewhere in this file exists to avoid for every OTHER way of building
// and running this project. Pinned here the same way, but only when that
// JDK is actually present: the same script ships inside the installer, and
// on any other machine it must simply fall through to the JAVA_HOME/PATH
// lookup it already does on its own.
tasks.named('startScripts') {
    doLast {
        def javaHome = 'C:\\Program_Files\\Java\\jdk-11.0.32.1'
        windowsScript.text = "@if exist \"${javaHome}\\bin\\java.exe\" set \"JAVA_HOME=${javaHome}\"\r\n" + windowsScript.text
    }
}

tasks.register('robotGuiTest', JavaExec) {
    group = 'verification'
    description = 'Runs the first graphical test (Robot, real desktop, non-headless).'
    dependsOn tasks.named('robotGuiTestClasses')
    classpath = sourceSets.robotGuiTest.runtimeClasspath
    mainClass = 'net.sourceforge.open_teradata_viewer.robot_gui_tests.OtvSplashScreenRobotTest'
    systemProperty 'java.awt.headless', 'false'
    workingDir = projectDir
    // A manually created JavaExec does NOT automatically inherit the project's
    // toolchain (unlike "test" and the "run" task from the application plugin,
    // which do so automatically): it must be specified explicitly, otherwise
    // Gradle runs the JAR (compiled for Java 11) with the JDK that is
    // launching Gradle itself, which may be older.
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

jar {
    manifest {
        attributes(
                'Main-Class': 'net.sourceforge.open_teradata_viewer.Main',
                // The plain jar only ever contains this project's own classes,
                // never its dependencies, so a bare "java -jar ...jar" needs to
                // be told where to find the rest. Listed here by bare file name,
                // meant to sit as siblings in the SAME folder as this jar - that
                // is exactly the layout "gradlew installDist" (or distZip/
                // distTar) produces on its own inside its "lib" folder (the
                // project's own jar and every dependency jar together, flat, no
                // nesting). A copy of this jar taken out on its own, with no
                // such siblings around it, still needs an explicit -cp, or
                // "gradlew run"/the runnableJar task below instead.
                'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }
}

// Resources OTV expects to find in ITS OWN WORKING DIRECTORY at runtime,
// scanned from the filesystem rather than loaded off the classpath: JDBC
// drivers (a custom classloader in Drivers.java looks for them there),
// third-party Look&Feel jars (ThirdPartyLookAndFeelManager, same mechanism),
// the bundled macros, and the spelling dictionary. They live at the project
// root, outside every Gradle sourceSet, so neither "jar" nor "installDist"
// ever picks them up on their own - copied here explicitly instead, next to
// every runnable artifact this build produces.
def runtimeWorkingDirFiles = [
        'english_dic.zip',
        'kunststoff.jar',
        'liquidlnf.jar',
        'mysql-connector-j-8.0.33.jar',
        'ojdbc11.jar',
        'terajdbc4.jar'
]

// Single, self-contained, double-click-runnable jar - every dependency
// merged in, nothing else needed on the classpath. The Java equivalent of
// Eclipse's old "Runnable JAR file" export with "Extract required libraries
// into generated JAR". Kept side by side with installDist/the .bat scripts,
// as an alternative rather than a replacement: a merge like this cannot
// preserve a META-INF/services file that two different dependency jars each
// contribute different content for (whichever copy is encountered first
// wins, the rest are dropped). Worth knowing for the one service OTV really
// looks up at runtime, javax.script.ScriptEngineFactory (Groovy's engine,
// provided by groovy-jsr223): today no other dependency contributes a file
// of that name, so nothing is lost - but a second JSR-223 engine added as a
// dependency (e.g. rhino-engine) would silently replace or be replaced by
// it in this jar and nowhere else.
tasks.register('runnableJar', Jar) {
    group = 'distribution'
    description = 'Builds a single, self-contained, double-click-runnable jar with every dependency merged in.'
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'net.sourceforge.open_teradata_viewer.Main'
    }
    from(sourceSets.main.output)
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })
    // Merged-in signatures from the original, separate dependency jars no
    // longer match the contents of this new one and fail verification.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.register('copyRuntimeWorkingDirFilesToLibs', Copy) {
    from(projectDir) {
        include runtimeWorkingDirFiles
    }
    from(projectDir) {
        include 'macros/**'
    }
    into layout.buildDirectory.dir('libs')
}

tasks.named('runnableJar') {
    finalizedBy tasks.named('copyRuntimeWorkingDirFilesToLibs')
}

tasks.register('copyRuntimeWorkingDirFilesToInstallDist', Copy) {
    from(projectDir) {
        include runtimeWorkingDirFiles
    }
    from(projectDir) {
        include 'macros/**'
    }
    into layout.buildDirectory.dir("install/${rootProject.name}/bin")
}

tasks.named('installDist') {
    finalizedBy tasks.named('copyRuntimeWorkingDirFilesToInstallDist')
}

