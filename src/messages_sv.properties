about.description=Version %s\n\nEtt databashanteringsverktyg, l\u00e4mpligt som front\u2011end f\u00f6r din Teradata-relationsdatabas. Anv\u00e4nds f\u00f6r att enkelt fr\u00e5ga, uppdatera och administrera din databas, skapa rapporter och synkronisera data.\n\nObservera att vissa funktioner f\u00f6r vissa spr\u00e5k kanske inte fungerar om inte systemet \u00e4r korrekt konfigurerat.\nExempelvis kr\u00e4ver kodkomplettering f\u00f6r Java en JRE i PATH, och Perl-komplettering kr\u00e4ver att Perl-programmet finns i PATH.
