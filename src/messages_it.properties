about.description=Versione %s\n\nUno strumento di amministrazione database, adatto come front\u2011end per il tuo database relazionale Teradata. Utilizzato per interrogare, aggiornare e amministrare facilmente il tuo database, creare report e sincronizzare dati.\n\nNota che alcune funzionalit\u00e0 per alcuni linguaggi potrebbero non funzionare a meno che il tuo sistema non sia configurato correttamente.\nAd esempio, il completamento del codice Java richiede un JRE nel tuo PATH e il completamento Perl richiede l'eseguibile Perl nel tuo PATH.
