# About dialog
about.description=Vers\u00e3o %s\n\nUma ferramenta de administra\u00e7\u00e3o de bases de dados, adequada como front\u2011end para a sua base de dados relacional Teradata. Utilizada para consultar, atualizar e administrar facilmente a sua base de dados, criar relat\u00f3rios e sincronizar dados.\n\nTenha em aten\u00e7\u00e3o que algumas funcionalidades podem n\u00e3o funcionar para determinados idiomas, a menos que o seu sistema esteja configurado corretamente.\nPor exemplo, o preenchimento autom\u00e1tico de c\u00f3digo Java requer um JRE na vari\u00e1vel PATH e o preenchimento autom\u00e1tico de Perl requer que o execut\u00e1vel do Perl esteja na vari\u00e1vel PATH.
