# About dialog
about.description=Version %s\n\nEt databaseadministrationsv\u00e6rkt\u00f8j, velegnet som gr\u00e6nseflade til din relationelle Teradata\u2011database. Bruges til bekvemt at udf\u00f8re foresp\u00f8rgsler, opdatere og administrere databasen, oprette rapporter og synkronisere data.\n\nBem\u00e6rk, at visse funktioner for visse sprog muligvis ikke fungerer, hvis systemet ikke er konfigureret korrekt.\nFor eksempel kr\u00e6ver Java\u2011kodefuldf\u00f8relse, at JRE findes i PATH\u2011variablen, mens Perl\u2011kodefuldf\u00f8relse kr\u00e6ver, at Perl\u2011programfilen findes i PATH.
about.copyright=Copyright (C) 2026 D. Campione

