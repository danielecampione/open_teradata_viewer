# About dialog
about.description=S\u00fcr\u00fcm %s\n\nTeradata ili\u015fkisel veritaban\u0131n\u0131z i\u00e7in \u00f6n u\u00e7 (front\u2011end) olarak uygun bir veritaban\u0131 y\u00f6netim arac\u0131. Veritaban\u0131n\u0131z\u0131 kolayca sorgulamak, g\u00fcncellemek ve y\u00f6netmek, rapor olu\u015fturmak ve verileri senkronize etmek i\u00e7in kullan\u0131l\u0131r.\n\nBaz\u0131 dillere \u00f6zg\u00fc baz\u0131 \u00f6zelliklerin, sisteminiz do\u011fru \u015fekilde yap\u0131land\u0131r\u0131lmad\u0131\u011f\u0131 s\u00fcrece \u00e7al\u0131\u015fmayabilece\u011fini unutmay\u0131n.\n\u00d6rne\u011fin, Java kod tamamlama \u00f6zelli\u011fi PATH de\u011fi\u015fkeninizde bir JRE gerektirir, Perl tamamlama \u00f6zelli\u011fi ise PATH de\u011fi\u015fkeninizde Perl \u00e7al\u0131\u015ft\u0131r\u0131labilir dosyas\u0131n\u0131 gerektirir.
about.copyright=Copyright (C) 2026 D. Campione

