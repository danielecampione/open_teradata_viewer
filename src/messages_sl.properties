# About dialog
about.description=Razli\u010dica %s\n\nOrodje za administracijo podatkovnih baz, primerno kot vmesnik za va\u0161o relacijsko podatkovno bazo Teradata. Uporablja se za enostavno poizvedovanje, posodabljanje in upravljanje podatkovne baze, ustvarjanje poro\u010dil in sinhronizacijo podatkov.\n\nUpo\u0161tevajte, da nekatere funkcije za nekatere jezike morda ne bodo delovale, \u010de va\u0161 sistem ni pravilno nastavljen.\nNa primer, dopolnjevanje kode Java zahteva JRE na poti PATH, dopolnjevanje kode Perl pa zahteva izvedljivo datoteko Perl na poti PATH.
about.copyright=Copyright (C) 2026 D. Campione

