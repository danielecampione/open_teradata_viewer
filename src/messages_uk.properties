# About dialog
about.description=\u0412\u0435\u0440\u0441\u0456\u044f %s\n\n\u0406\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043d\u043d\u044f \u0431\u0430\u0437 \u0434\u0430\u043d\u0438\u0445, \u043f\u0440\u0438\u0434\u0430\u0442\u043d\u0438\u0439 \u044f\u043a \u0456\u043d\u0442\u0435\u0440\u0444\u0435\u0439\u0441 \u0434\u043b\u044f \u0432\u0430\u0448\u043e\u0457 \u0440\u0435\u043b\u044f\u0446\u0456\u0439\u043d\u043e\u0457 \u0431\u0430\u0437\u0438 \u0434\u0430\u043d\u0438\u0445 Teradata. \u0412\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0454\u0442\u044c\u0441\u044f \u0434\u043b\u044f \u0437\u0440\u0443\u0447\u043d\u043e\u0433\u043e \u0432\u0438\u043a\u043e\u043d\u0430\u043d\u043d\u044f \u0437\u0430\u043f\u0438\u0442\u0456\u0432, \u043e\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044f \u0439 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0443\u0432\u0430\u043d\u043d\u044f \u0431\u0430\u0437\u0438 \u0434\u0430\u043d\u0438\u0445, \u0441\u0442\u0432\u043e\u0440\u0435\u043d\u043d\u044f \u0437\u0432\u0456\u0442\u0456\u0432 \u0456 \u0441\u0438\u043d\u0445\u0440\u043e\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0434\u0430\u043d\u0438\u0445.\n\n\u0417\u0430\u0443\u0432\u0430\u0436\u0442\u0435, \u0449\u043e \u0434\u0435\u044f\u043a\u0456 \u0444\u0443\u043d\u043a\u0446\u0456\u0457 \u0434\u043b\u044f \u0434\u0435\u044f\u043a\u0438\u0445 \u043c\u043e\u0432 \u043c\u043e\u0436\u0443\u0442\u044c \u043d\u0435 \u043f\u0440\u0430\u0446\u044e\u0432\u0430\u0442\u0438, \u044f\u043a\u0449\u043e \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u043d\u0435 \u043d\u0430\u043b\u0430\u0448\u0442\u043e\u0432\u0430\u043d\u0430 \u043d\u0430\u043b\u0435\u0436\u043d\u0438\u043c \u0447\u0438\u043d\u043e\u043c.\n\u041d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434, \u0430\u0432\u0442\u043e\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f \u043a\u043e\u0434\u0443 Java \u043f\u043e\u0442\u0440\u0435\u0431\u0443\u0454 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 JRE \u0443 \u0437\u043c\u0456\u043d\u043d\u0456\u0439 PATH, \u0430 \u0430\u0432\u0442\u043e\u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f Perl \u2011 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 \u0432\u0438\u043a\u043e\u043d\u0443\u0432\u0430\u043d\u043e\u0433\u043e \u0444\u0430\u0439\u043b\u0443 Perl \u0443 PATH.
