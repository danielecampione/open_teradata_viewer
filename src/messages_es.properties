# About dialog
about.description=Versi\u00f3n %s\n\nUna herramienta de administraci\u00f3n de bases de datos, apta para actuar como frontal de su base de datos relacional Teradata. Se utiliza para consultar, actualizar y administrar f\u00e1cilmente su base de datos, crear informes y sincronizar datos.\n\nTenga en cuenta que algunas funciones pueden no funcionar en determinados idiomas a menos que su sistema est\u00e9 configurado correctamente.\nPor ejemplo, la finalizaci\u00f3n de c\u00f3digo Java requiere un JRE en su PATH, y la finalizaci\u00f3n de Perl requiere que el ejecutable de Perl est\u00e9 en su PATH.
about.copyright=Copyright (C) 2026 D. Campione

