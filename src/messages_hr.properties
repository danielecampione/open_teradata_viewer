# About dialog
about.description=Verzija %s\n\nAlat za administraciju baze podataka, prikladan kao front\u2011end za va\u0161u relacijsku bazu podataka Teradata. Koristi se za jednostavno postavljanje upita, a\u017euriranje i administraciju va\u0161e baze podataka, izradu izvje\u0161taja i sinkronizaciju podataka.\n\nImajte na umu da neke zna\u010dajke za pojedine jezike mo\u017eda ne\u0107e raditi ako va\u0161 sustav nije ispravno postavljen.\nNa primjer, dovr\u0161avanje Java koda zahtijeva JRE u va\u0161oj PATH varijabli, a dovr\u0161avanje Perl koda zahtijeva da izvr\u0161na datoteka Perl bude u va\u0161oj PATH varijabli.
