about.description=Versjon %s\n\nEt administrasjonsverkt\u00f8y for databaser, egnet som front\u2011end for din Teradata-relasjonsdatabase. Brukes til enkelt \u00e5 sp\u00f8rre, oppdatere og administrere databasen din, lage rapporter og synkronisere data.\n\nMerk at enkelte funksjoner for enkelte spr\u00e5k kan slutte \u00e5 virke med mindre systemet ditt er riktig satt opp.\nJava-kodefullf\u00f8ring krever for eksempel en JRE i PATH, og Perl-fullf\u00f8ring krever at Perl-programfilen ligger i PATH.
