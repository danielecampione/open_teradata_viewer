# About dialog
about.description=Versioon %s\n\nAndmebaasi haldust\u00f6\u00f6riist, mis sobib front\u2011end lahendusena sinu Teradata relatsiooniandmebaasile. Kasutatakse andmebaasi h\u00f5lpsaks p\u00e4ringute tegemiseks, uuendamiseks ja haldamiseks, aruannete koostamiseks ning andmete s\u00fcnkroonimiseks.\n\nPane t\u00e4hele, et m\u00f5ne keele puhul ei pruugi m\u00f5ned funktsioonid t\u00f6\u00f6tada, kui su s\u00fcsteem ei ole korrektselt seadistatud.\nN\u00e4iteks Java koodi automaatl\u00f5petamine vajab JRE-d sinu PATH-muutujas ning Perli automaatl\u00f5petamine vajab, et Perli k\u00e4ivitusfail oleks sinu PATH-muutujas.
