# About dialog
about.description=Versija %s\n\nDuomen\u0173 bazi\u0173 administravimo priemon\u0117, tinkama kaip front\u2011end j\u016bs\u0173 Teradata reliacinei duomen\u0173 bazei. Naudojama patogiai atlikti u\u017eklausas, atnaujinti bei administruoti duomen\u0173 baz\u0119, kurti ataskaitas ir sinchronizuoti duomenis.\n\nAtkreipkite d\u0117mes\u012f, kad kai kurios funkcijos tam tikroms kalboms gali neveikti, jei j\u016bs\u0173 sistema n\u0117ra tinkamai sukonfig\u016bruota.\nPavyzd\u017eiui, Java kodo u\u017ebaigimui reikalinga JRE j\u016bs\u0173 PATH kintamajame, o Perl u\u017ebaigimui reikalinga, kad vykdomasis Perl failas b\u016bt\u0173 j\u016bs\u0173 PATH kintamajame.
