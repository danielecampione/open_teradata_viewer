# About dialog
about.description=Versio %s\n\nTietokannan hallintaty\u00f6kalu, joka soveltuu k\u00e4ytt\u00f6liittym\u00e4ksi Teradata\u2011relaatiotietokannallesi. K\u00e4ytet\u00e4\u00e4n tietokannan helppoon kyselyyn, p\u00e4ivitykseen ja hallintaan sek\u00e4 raporttien luontiin ja tietojen synkronointiin.\n\nHuomaa, ett\u00e4 jotkin ominaisuudet tietyill\u00e4 kielill\u00e4 eiv\u00e4t v\u00e4ltt\u00e4m\u00e4tt\u00e4 toimi, ellei j\u00e4rjestelm\u00e4\u00e4si ole m\u00e4\u00e4ritetty oikein.\nEsimerkiksi Java\u2011koodin t\u00e4ydennys vaatii JRE:n PATH\u2011muuttujassa, ja Perl\u2011t\u00e4ydennys vaatii Perl\u2011suoritustiedoston PATH\u2011muuttujassa.
