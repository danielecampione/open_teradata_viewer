# About dialog
about.description=Version %s\n\nEin Datenbank-Verwaltungswerkzeug, geeignet als Front\u2011End f\u00fcr Ihre relationale Teradata-Datenbank. Verwenden Sie es, um Ihre Datenbank einfach abzufragen, zu aktualisieren und zu verwalten, Berichte zu erstellen und Daten zu synchronisieren.\n\nBitte beachten Sie, dass einige Funktionen f\u00fcr bestimmte Sprachen m\u00f6glicherweise nicht funktionieren, es sei denn, Ihr System ist korrekt konfiguriert.\nBeispielsweise erfordert die Java-Codevervollst\u00e4ndigung eine JRE in Ihrem PATH und die Perl-Vervollst\u00e4ndigung die ausf\u00fchrbare Perl-Datei in Ihrem PATH.
about.copyright=Copyright (C) 2026 D. Campione

