# About dialog
about.description=Verzia %s\n\nN\u00e1stroj na spr\u00e1vu datab\u00e1z, vhodn\u00fd ako klientske rozhranie pre va\u0161u rela\u010dn\u00fa datab\u00e1zu Teradata. Sl\u00fa\u017ei na jednoduch\u00e9 vytv\u00e1ranie dotazov, aktualiz\u00e1ciu a spr\u00e1vu datab\u00e1zy, tvorbu zost\u00e1v a synchroniz\u00e1ciu \u00fadajov.\n\nUpozor\u0148ujeme, \u017ee niektor\u00e9 funkcie pre niektor\u00e9 jazyky nemusia fungova\u0165, ak nie je v\u00e1\u0161 syst\u00e9m spr\u00e1vne nastaven\u00fd.\nNapr\u00edklad dop\u013a\u0148anie k\u00f3du v Jave vy\u017eaduje JRE v premennej PATH a dop\u013a\u0148anie k\u00f3du v Perle vy\u017eaduje spustite\u013en\u00fd s\u00fabor Perlu v premennej PATH.
