# About dialog
about.description=Verze %s\n\nN\u00e1stroj pro spr\u00e1vu datab\u00e1z\u00ed, vhodn\u00fd jako klientsk\u00e1 aplikace (front\u2011end) pro rela\u010dn\u00ed datab\u00e1zi Teradata. Slou\u017e\u00ed k pohodln\u00e9mu dotazov\u00e1n\u00ed, aktualizaci a spr\u00e1v\u011b datab\u00e1ze, vytv\u00e1\u0159en\u00ed sestav a synchronizaci dat.\n\nN\u011bkter\u00e9 funkce pro n\u011bkter\u00e9 jazyky nemus\u00ed fungovat, pokud nen\u00ed syst\u00e9m spr\u00e1vn\u011b nastaven.\nNap\u0159\u00edklad dopl\u0148ov\u00e1n\u00ed k\u00f3du Java vy\u017eaduje JRE v prom\u011bnn\u00e9 PATH a dopl\u0148ov\u00e1n\u00ed Perlu vy\u017eaduje spustiteln\u00fd soubor Perlu v prom\u011bnn\u00e9 PATH.
