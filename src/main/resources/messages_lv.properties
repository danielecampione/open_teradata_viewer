about.description=Versija %s\n\nDatub\u0101zes administr\u0113\u0161anas r\u012bks, kas piem\u0113rots k\u0101 priek\u0161gals (front\u2011end) j\u016bsu Teradata rel\u0101ciju datub\u0101zei. Izmantojams, lai \u0113rti veiktu vaic\u0101jumus, atjaunin\u0101tu un administr\u0113tu j\u016bsu datub\u0101zi, izveidotu p\u0101rskatus un sinhroniz\u0113tu datus.\n\n\u0145emiet v\u0113r\u0101, ka da\u017eas funkcijas da\u017e\u0101m valod\u0101m var nedarboties, ja j\u016bsu sist\u0113ma nav pareizi konfigur\u0113ta.\nPiem\u0113ram, Java koda pabeig\u0161anai nepiecie\u0161ams JRE j\u016bsu PATH main\u012bgaj\u0101, bet Perl koda pabeig\u0161anai nepiecie\u0161ams, lai Perl izpildfails b\u016btu j\u016bsu PATH main\u012bgaj\u0101.
