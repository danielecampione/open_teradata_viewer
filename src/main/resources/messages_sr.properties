# About dialog
about.description=Verzija %s\n\nAlat za administraciju baze podataka, pogodan kao front\u2011end za va\u0161u relacionu bazu podataka Teradata. Koristi se za jednostavno izvr\u0161avanje upita, a\u017euriranje i administraciju va\u0161e baze podataka, izradu izve\u0161taja i sinhronizaciju podataka.\n\nImajte na umu da neke funkcije za pojedine jezike mo\u017eda ne\u0107e raditi ako va\u0161 sistem nije ispravno pode\u0161en.\nNa primer, dovr\u0161avanje Java koda zahteva JRE u va\u0161oj PATH promenljivoj, a dovr\u0161avanje Perl koda zahteva da izvr\u0161na datoteka Perl-a bude u va\u0161oj PATH promenljivoj.
