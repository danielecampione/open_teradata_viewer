about.description=Verzi\u00f3: %s\n\nAdatb\u00e1zis-adminisztr\u00e1ci\u00f3s eszk\u00f6z, amely a Teradata rel\u00e1ci\u00f3s adatb\u00e1zis kezel\u0151fel\u00fcletek\u00e9nt is haszn\u00e1lhat\u00f3. Seg\u00edts\u00e9g\u00e9vel egyszer\u0171en lek\u00e9rdezheti, friss\u00edtheti \u00e9s kezelheti adatb\u00e1zis\u00e1t, jelent\u00e9seket k\u00e9sz\u00edthet \u00e9s szinkroniz\u00e1lhatja az adatokat.\n\nVegye figyelembe, hogy egyes nyelvek bizonyos funkci\u00f3i csak megfelel\u0151en be\u00e1ll\u00edtott rendszeren m\u0171k\u00f6dnek.\nP\u00e9ld\u00e1ul a Java-k\u00f3dkieg\u00e9sz\u00edt\u00e9shez a PATH-on szerepl\u0151 JRE sz\u00fcks\u00e9ges, a Perl-k\u00f3dkieg\u00e9sz\u00edt\u00e9shez pedig a Perl v\u00e9grehajthat\u00f3 f\u00e1jlnak kell szerepelnie a PATH-on.
