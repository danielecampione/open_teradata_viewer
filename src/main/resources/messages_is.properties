# About dialog
about.description=\u00datg\u00e1fa %s\n\nUmsj\u00f3nart\u00f3l fyrir gagnagrunna, hentugt sem framendi fyrir Teradata-venslagagnagrunninn \u00feinn. Nota\u00f0 til a\u00f0 spyrja gagnagrunninn au\u00f0veldlega, uppf\u00e6ra hann og stj\u00f3rna honum, b\u00faa til sk\u00fdrslur og samstilla g\u00f6gn.\n\nAthuga\u00f0u a\u00f0 sumir eiginleikar fyrir sum tungum\u00e1l virka hugsanlega ekki nema kerfi\u00f0 s\u00e9 r\u00e9tt uppsett.\nTil d\u00e6mis krefst Java-k\u00f3\u00f0a\u00fatfylling \u00feess a\u00f0 JRE s\u00e9 \u00e1 PATH og Perl-k\u00f3\u00f0a\u00fatfylling krefst \u00feess a\u00f0 Perl-keyrsluskr\u00e1in s\u00e9 \u00e1 PATH.
about.copyright=Copyright (C) 2026 D. Campione

